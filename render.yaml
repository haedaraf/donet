services:
  # Laravel Web Service
  - type: web
    name: donet-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore # Closest to Indonesia
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Donet
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: donet-app
          property: host
          format: https://{host}

      # Database - akan di-link ke PostgreSQL di bawah
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: donet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: donet-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: donet-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: donet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: donet-db
          property: password

      # Session & Cache - pakai database (tidak butuh Redis)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Filesystem - pakai local (ephemeral, tapi cukup untuk demo)
      - key: FILESYSTEM_DISK
        value: public

      # Mail - pakai log untuk sekarang
      - key: MAIL_MAILER
        value: log

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      - key: VITE_APP_NAME
        value: Donet

  # PostgreSQL Database (Free - 1GB, 90 hari)
databases:
  - name: donet-db
    plan: free
    region: singapore
    databaseName: donet
    user: donet_user
